<!doctype html>
<html lang="{{ html_lang|default:'en' }}">
<head>
  {% load static %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}Portfolio template - Your role. Your tagline. Edit content in core/site_data.py.{% endblock %}">
  <title>{% block title %}Portfolio | Template{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=47">
</head>
<body class="{% block body_class %}{% endblock %}">

  <nav class="lang-switcher" aria-label="{{ ui.lang_switcher_aria }}">
    <a href="{% url 'set_language' %}?lang=en&next={{ request.path }}"
       class="lang-btn{% if lang == 'en' %} is-active{% endif %}">{{ ui.lang_en }}</a>
    <span class="lang-divider" aria-hidden="true">|</span>
    <a href="{% url 'set_language' %}?lang=sv&next={{ request.path }}"
       class="lang-btn{% if lang == 'sv' %} is-active{% endif %}">{{ ui.lang_sv }}</a>
  </nav>

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/site.js' %}?v=3"></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
