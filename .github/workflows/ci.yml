# Continuous Integration: checks every pull request and every change on main.
# Three check jobs run side by side, so one red job shows exactly which kind of check failed.
# The Docker image is built and tested only after all three are green.
# On main (and on a version tag) the tested image is then stored in GitHub Container Registry.
# On main it is then deployed: first to staging, then, after approval, to production.
name: CI

on:
  # Pushes to main run here. Work on other branches is checked through its pull request,
  # so the same commit is not checked twice.
  push:
    branches: [main]
    # A version tag such as v1.0.0 marks a release.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check code style and common mistakes
        run: ruff check .

  test:
    name: Tests (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run the tests (every page in EN and SV, language switch, 404)
        run: python manage.py test --verbosity 2

  security:
    name: Security (pip-audit, bandit, deploy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check the packages for known security holes
        run: pip-audit -r requirements.txt
      - name: Check the code for risky patterns
        run: bandit -r core config
      - name: Check the production settings
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: samparsa.se
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          python manage.py check --deploy --fail-level WARNING

  build:
    name: Build and test the image (Docker)
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to store the image in GitHub Container Registry
    env:
      IMAGE: ghcr.io/samkian0007/portfolio-cicd
    steps:
      - uses: actions/checkout@v7
      - name: Build the image, tagged with the commit
        # The labels record which commit and which repository the image was built from.
        run: |
          docker build -t portfolio:${{ github.sha }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            .
      - name: Start the image with production settings
        run: |
          docker run -d --name portfolio -p 8000:8000 \
            -e DJANGO_ENV=production \
            -e DJANGO_DEBUG=False \
            -e DJANGO_ALLOWED_HOSTS=samparsa.se \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            portfolio:${{ github.sha }}
      - name: Smoke test the running container
        run: scripts/smoke_test.sh http://localhost:8000 samparsa.se
      - name: Show the container log
        if: always()
        run: docker logs portfolio

      # Only images that passed every check above are stored. Pull requests stop here.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Store the tested image, tagged with the commit
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag portfolio:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
      - name: Give the stored image its version name (releases only)
        # The version points to the image that was already stored for this commit,
        # so a release is exactly the image that went through staging and production.
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker buildx imagetools create -t "$IMAGE:${{ github.ref_name }}" "$IMAGE:${{ github.sha }}"

  staging:
    name: Deploy to staging
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: staging
    permissions:
      contents: read
      packages: read # the server pulls the image with this run's key
    env:
      IMAGE: ghcr.io/samkian0007/portfolio-cicd:${{ github.sha }}
      SERVER: deploy@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up the SSH key for the server
        id: ssh
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Let the server log in to the registry (only for this run)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$SERVER" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start the image on the server (staging, port 8002)
        run: ssh "$SERVER" bash -s -- "$IMAGE" portfolio-staging 8002 < scripts/deploy.sh
      - name: Smoke test staging
        run: ssh "$SERVER" bash -s -- http://127.0.0.1:8002 samparsa.se < scripts/smoke_test.sh
      - name: Log the server out of the registry
        if: always() && steps.ssh.outcome == 'success' # only when the server can be reached
        run: ssh "$SERVER" docker logout ghcr.io

  production:
    name: Deploy to production
    needs: staging
    runs-on: ubuntu-latest
    environment:
      name: production # waits for approval
      url: https://samparsa.se
    concurrency: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/samkian0007/portfolio-cicd:${{ github.sha }}
      SERVER: deploy@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up the SSH key for the server
        id: ssh
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Let the server log in to the registry (only for this run)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$SERVER" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Start the same image in production (port 8003)
        run: ssh "$SERVER" bash -s -- "$IMAGE" portfolio-production 8003 < scripts/deploy.sh
      - name: Smoke test production
        run: ssh "$SERVER" bash -s -- http://127.0.0.1:8003 samparsa.se < scripts/smoke_test.sh
      - name: Log the server out of the registry
        if: always() && steps.ssh.outcome == 'success' # only when the server can be reached
        run: ssh "$SERVER" docker logout ghcr.io
