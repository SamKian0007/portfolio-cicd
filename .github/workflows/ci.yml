# Continuous Integration: checks every pull request and every change on main.
# Three check jobs run side by side, so one red job shows exactly which kind of check failed.
# The Docker image is built and tested only after all three are green.
name: CI

on:
  # Pushes to main run here. Work on other branches is checked through its pull request,
  # so the same commit is not checked twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check code style and common mistakes
        run: ruff check .

  test:
    name: Tests (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run the tests (every page in EN and SV, language switch, 404)
        run: python manage.py test --verbosity 2

  security:
    name: Security (pip-audit, bandit, deploy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Check the packages for known security holes
        run: pip-audit -r requirements.txt
      - name: Check the code for risky patterns
        run: bandit -r core config
      - name: Check the production settings
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: samparsa.se
        run: |
          DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          python manage.py check --deploy --fail-level WARNING

  build:
    name: Build and test the image (Docker)
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image, tagged with the commit
        run: docker build -t portfolio:${{ github.sha }} .
      - name: Start the image with production settings
        run: |
          docker run -d --name portfolio -p 8000:8000 \
            -e DJANGO_ENV=production \
            -e DJANGO_DEBUG=False \
            -e DJANGO_ALLOWED_HOSTS=samparsa.se \
            -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            portfolio:${{ github.sha }}
      - name: Smoke test the running container
        run: scripts/smoke_test.sh http://localhost:8000 samparsa.se
      - name: Show the container log
        if: always()
        run: docker logs portfolio
